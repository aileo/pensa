# Overlay pinning both images to the latest published release instead of `latest`, which
# follows the main branch and therefore carries unreleased code. It only overrides two image
# names — it is not a stack on its own, and is always used alongside compose.prod.yaml:
#
#   docker compose -f compose.prod.yaml -f compose.stable.yaml up -d
#
# Keeping it this short is deliberate: a full copy of compose.prod.yaml would drift from it,
# and the drift would only show up in production.
services:
  api:
    image: ghcr.io/aileo/pensa-api:stable
  web:
    image: ghcr.io/aileo/pensa-web:stable
