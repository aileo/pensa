name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The deployment is a single shared resource: queue instead of racing, and let
# a running deployment finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # The guides' screenshots are retaken from a throwaway, freshly seeded
      # instance, so the published site always shows the current interface.
      # The committed copies in docs/images are what GitHub renders meanwhile.
      - name: Take the user-guide screenshots
        run: docker compose -f compose.screenshots.yaml run --rm --build screenshots
      - name: Stop the screenshot instance
        if: always()
        run: docker compose -f compose.screenshots.yaml down -v
      # The build collects docs/ into the site and fails on a dead internal
      # link, so a pull request that breaks a cross-reference is caught here.
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
