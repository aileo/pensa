name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build is also the translation check: TranslationKey is derived from the
      # French strings, so a missing English counterpart fails type checking here.
      - run: npm run build

  api:
    name: API — lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pensa
          POSTGRES_PASSWORD: pensa
          POSTGRES_DB: pensa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pensa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pensa:pensa@localhost:5432/pensa
      # The test suite sends this exact origin on write requests.
      WEB_ORIGIN: http://localhost:5173
      # The suite signs accounts up without an invitation; one test closes it back down.
      OPEN_REGISTRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      # The suite logs in as seeded accounts and aborts without them.
      - run: npm run seed
      - run: npm test

  images:
    name: Images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
