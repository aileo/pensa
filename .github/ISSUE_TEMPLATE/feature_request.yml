name: Feature request
description: Suggest an improvement or a new capability.
title: ""
labels:
  - type: feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What need or difficulty would this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe what you would like the app to do.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What should be true for this feature to solve the problem?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, mockups, or other relevant details.
    validations:
      required: false
