services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pensa
      POSTGRES_PASSWORD: pensa
      POSTGRES_DB: pensa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pensa"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ./apps/api
      dockerfile: ../../Dockerfile.dev
    working_dir: /app
    command: sh -c "npm run migrate && npm run dev"
    volumes:
      - ./apps/api:/app
      - api_modules:/app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://pensa:pensa@db:5432/pensa}
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      # Local development is a sandbox: sign up freely, without inventing an invitation first.
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  web:
    build:
      context: ./apps/web
      dockerfile: ../../Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./apps/web:/app
      - web_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
  # The documentation site. Not part of the app — it is here so that previewing
  # it needs no Node.js on the machine, like everything else.
  site:
    build:
      context: ./site
      dockerfile: ../Dockerfile.dev
    working_dir: /app
    command: npm run dev
    volumes:
      - ./site:/app
      # The site is built from the documentation, which the collect script
      # reads one level above the site directory — here, the container root.
      - ./docs:/docs:ro
      - ./AGENT.md:/AGENT.md:ro
      - ./CHANGELOG.md:/CHANGELOG.md:ro
      - site_modules:/app/node_modules
    ports:
      - "5175:5173"
volumes:
  pgdata:
  api_modules:
  web_modules:
  site_modules:
